</script>
</body>
</html>
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ร่วมโหวต — Live Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --glass-bg:rgba(255,255,255,.7);
    --glass-bg-strong:rgba(255,255,255,.9);
    --glass-border:rgba(255,255,255,.6);
    --glass-shadow:0 8px 32px rgba(31,38,135,.08);
    --ink:#1d1d1f;
    --ink-secondary:#6e6e73;
    --ink-tertiary:#aeaeb2;
    --accent:#0071e3;
    --accent-2:#5856d6;
    --accent-3:#ff375f;
    --success:#34c759;
    --warning:#ff9500;
    --radius:22px;
    --radius-sm:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    background:#f2f2f7;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 600px 400px at 10% 20%, rgba(88,86,214,.15), transparent 60%),
      radial-gradient(ellipse 500px 500px at 90% 80%, rgba(0,113,227,.12), transparent 60%),
      radial-gradient(ellipse 400px 300px at 50% 50%, rgba(255,55,95,.06), transparent 60%);
    animation:bgFloat 20s ease-in-out infinite alternate;
  }
  @keyframes bgFloat{0%{transform:translate(0,0);}100%{transform:translate(-20px,20px);}}

  .card{
    position:relative;z-index:1;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:28px 24px;
    max-width:440px;width:100%;
    box-shadow:0 12px 40px rgba(31,38,135,.12);
    animation:cardIn .5s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(0,0,0,.06);}
  .brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg, var(--accent), var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,113,227,.35);}
  .brand-text h1{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .brand-text .dev{display:inline-block;margin-top:3px;font-size:10px;font-weight:600;color:var(--accent);background:rgba(0,113,227,.1);padding:2px 8px;border-radius:999px;}

  .name-screen{text-align:center;}
  .name-screen .emoji{font-size:48px;margin-bottom:12px;}
  .name-screen h2{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px;}
  .name-screen p{font-size:14px;color:var(--ink-secondary);margin-bottom:20px;line-height:1.5;}
  .name-input{width:100%;padding:14px 16px;border-radius:14px;border:none;background:rgba(118,118,128,.12);color:var(--ink);font-size:16px;font-family:inherit;font-weight:500;text-align:center;transition:.2s;margin-bottom:14px;}
  .name-input:focus{outline:none;background:rgba(0,113,227,.12);box-shadow:0 0 0 3px rgba(0,113,227,.15);}
  .name-input::placeholder{color:var(--ink-tertiary);}
  .name-hint{font-size:12px;color:var(--ink-tertiary);margin-bottom:18px;}
  .join-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(0,113,227,.35);transition:.2s;}
  .join-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,113,227,.45);}
  .join-btn:active{transform:translateY(0);}
  .join-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .question-image{max-width:100%;border-radius:14px;margin-bottom:16px;border:1px solid rgba(0,0,0,.08);display:block;box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .question-wrap{margin-bottom:22px;}
  .question{font-size:20px;font-weight:700;line-height:1.4;color:var(--ink);letter-spacing:-.3px;}
  .chalk-underline{display:block;width:60%;height:8px;margin:8px auto 0;}
  .chalk-underline path{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;opacity:.5;}

  .opt-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;margin-bottom:8px;border:none;background:rgba(255,255,255,.7);color:var(--ink);border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;border:1.5px solid rgba(0,0,0,.06);transition:.2s;}
  .opt-btn:hover{background:rgba(255,255,255,.95);transform:translateX(3px);}
  .opt-btn:active{transform:scale(.98);}
  .opt-btn .letter{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
  .opt-btn.selected{background:rgba(52,199,89,.12);color:var(--success);border-color:var(--success);}
  .opt-btn.correct{background:rgba(52,199,89,.15);color:var(--success);border-color:var(--success);box-shadow:0 0 0 2px rgba(52,199,89,.3);}
  .opt-btn.wrong{background:rgba(255,55,95,.1);color:var(--accent-3);border-color:var(--accent-3);opacity:.7;}
  .opt-btn .result-icon{margin-left:auto;font-size:16px;}

  .rating-container{margin:18px 0;}
  .rating-stars{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
  .rating-star{font-size:38px;cursor:pointer;transition:.15s;filter:grayscale(.6) opacity(.35);user-select:none;}
  .rating-star:hover{transform:scale(1.15);filter:none;}
  .rating-star.active{filter:none;transform:scale(1.1);}
  .rating-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-secondary);padding:0 6px;}
  .rating-value{font-size:24px;font-weight:700;text-align:center;margin-top:10px;background:linear-gradient(135deg, var(--accent), var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;min-height:32px;}

  textarea.answer-input{width:100%;padding:14px 16px;border-radius:14px;border:none;background:rgba(118,118,128,.12);color:var(--ink);font-size:15px;font-family:inherit;font-weight:500;resize:none;transition:.2s;}
  textarea.answer-input:focus{outline:none;background:rgba(0,113,227,.12);box-shadow:0 0 0 3px rgba(0,113,227,.15);}
  .char-count{font-size:11px;color:var(--ink-tertiary);text-align:right;margin-top:6px;}

  .submit-btn{width:100%;padding:15px;margin-top:14px;border:none;border-radius:14px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(0,113,227,.35);transition:.2s;}
  .submit-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,113,227,.45);}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .msg{color:var(--ink-secondary);font-size:14px;margin-top:14px;line-height:1.5;text-align:center;}
  .thankyou, .waiting{font-size:44px;margin-bottom:10px;text-align:center;}
  .waiting{animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .your-answer{background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.25);color:var(--success);border-radius:12px;padding:12px 14px;font-weight:600;margin-top:10px;font-size:14px;text-align:center;}
  .quiz-result{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;margin-top:12px;}
  .quiz-result.correct{background:rgba(52,199,89,.15);color:var(--success);border:1px solid rgba(52,199,89,.3);}
  .quiz-result.wrong{background:rgba(255,55,95,.1);color:var(--accent-3);border:1px solid rgba(255,55,95,.25);}

  #toastContainer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;width:min(92vw,360px);}
  .toast{background:rgba(255,255,255,.95);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.6);color:var(--ink);padding:13px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.1);animation:toastIn .3s cubic-bezier(.2,.9,.3,1);}
  .toast.success{border-left:4px solid var(--success);}
  .toast.error{border-left:4px solid var(--accent-3);}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  @media(max-width:480px){
    .card{padding:22px 18px;}
    .question{font-size:18px;}
    .rating-star{font-size:34px;}
    .opt-btn{padding:12px;font-size:14px;}
  }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="brand">
    <div class="brand-mark">⚡</div>
    <div class="brand-text">
      <h1>Live Poll</h1>
      <div class="dev">@Skunkworks</div>
    </div>
  </div>
  <div id="content">
    <div class="name-screen">
      <div class="emoji">👋</div>
      <h2>ยินดีต้อนรับ!</h2>
      <p>กรุณากรอกชื่อหรือชื่อเล่นก่อนเริ่มโพล</p>
      <input type="text" class="name-input" id="nameInput" placeholder="เช่น สมชาย, น้องมายด์" maxlength="20" autocomplete="off">
      <div class="name-hint">ชื่อจะแสดงให้ครูเห็นเมื่อตอบโพล</div>
      <button class="join-btn" id="joinBtn" disabled>เข้าร่วมโพล</button>
    </div>
  </div>
</div>
<div id="toastContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, CLASS_LIST } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const params = new URLSearchParams(location.search);
const classId = params.get("class") || CLASS_LIST[0];
const pollRef = doc(db, "polls", classId);

const COLORS = ['#0071e3','#5856d6','#af52de','#ff2d55','#ff9500','#ffcc00','#34c759','#5ac8fa'];

function showToast(msg, type = "info") {
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 300); }, 3000);
}

function getStudentId() {
  let id = localStorage.getItem("studentDeviceId");
  if (!id) { id = "dev_" + Math.random().toString(36).slice(2) + Date.now(); localStorage.setItem("studentDeviceId", id); }
  return id;
}
const studentId = getStudentId();
const contentEl = document.getElementById("content");
let studentName = localStorage.getItem(`studentName_${classId}`) || '';

const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");

if (studentName) {
  nameInput.value = studentName;
  joinBtn.disabled = false;
}

nameInput.addEventListener("input", () => {
  joinBtn.disabled = nameInput.value.trim().length === 0;
});

joinBtn.addEventListener("click", () => {
  const name = nameInput.value.trim();
  if (!name) return;
  studentName = name;
  localStorage.setItem(`studentName_${classId}`, name);
  startPollListener();
});

nameInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter" && nameInput.value.trim().length > 0) joinBtn.click();
});

function startPollListener() {
  contentEl.innerHTML = `<div class="waiting">⏳</div><div class="msg">กำลังรอครูเริ่มโพล...</div><div style="margin-top:14px;font-size:12px;color:var(--ink-tertiary);text-align:center;">สวัสดี <b>${escapeHtml(studentName)}</b> 👋</div>`;
  
  onSnapshot(pollRef, (snap) => {
    if (!snap.exists()) return renderWaiting();
    const data = snap.data();
    const votedInfo = getVotedInfo(classId);
    if (!data.active) return renderClosed();
    if (votedInfo && votedInfo.pollId === data.pollId) return renderVoted(data, votedInfo);
    renderQuestion(data);
  }, (err) => {
    contentEl.innerHTML = `<div class="waiting">⚠️</div><div class="msg">เชื่อมต่อไม่สำเร็จ</div>`;
  });
}

function getVotedInfo(classId) {
  const raw = localStorage.getItem(`voted_${classId}`);
  return raw ? JSON.parse(raw) : null;
}
function renderWaiting() {
  contentEl.innerHTML = `<div class="waiting">⏳</div><div class="msg">กำลังรอครูเริ่มโพล...</div><div style="margin-top:14px;font-size:12px;color:var(--ink-tertiary);text-align:center;">สวัสดี <b>${escapeHtml(studentName)}</b> 👋</div>`;
}
function renderClosed() {
  contentEl.innerHTML = `<div class="thankyou">✅</div><div class="msg" style="font-size:16px;font-weight:600;">โพลนี้ปิดแล้ว</div><div class="msg">ขอบคุณที่ร่วมโหวต <b>${escapeHtml(studentName)}</b> 🙏</div>`;
}
function underlineSvg() {
  return `<svg class="chalk-underline" viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M2,9 Q40,2 78,9 T154,9 T230,9 T298,9"/></svg>`;
}
function imageHtml(data) {
  return data.image ? `<img class="question-image" src="${data.image}">` : "";
}

function renderQuestion(data) {
  let html = imageHtml(data);
  html += `<div class="question-wrap"><div class="question">${escapeHtml(data.question)}</div>${underlineSvg()}</div>`;
  
  if (data.type === "text") {
    html += `<textarea id="answerInput" class="answer-input" rows="3" maxlength="120" placeholder="พิมพ์คำตอบของคุณ..."></textarea>
      <div class="char-count"><span id="charCount">0</span>/120</div>
      <button class="submit-btn" id="submitBtn" disabled>ส่งคำตอบ</button>`;
    contentEl.innerHTML = html;
    const input = document.getElementById("answerInput");
    const btn = document.getElementById("submitBtn");
    input.addEventListener("input", () => {
      document.getElementById("charCount").textContent = input.value.length;
      btn.disabled = input.value.trim().length === 0;
    });
    btn.addEventListener("click", () => submitText(input.value.trim(), data));
  } 
  else if (data.type === "rating") {
    html += `<div class="rating-container">
      <div class="rating-stars" id="ratingStars">
        ${[1,2,3,4,5].map(i => `<span class="rating-star" data-value="${i}">⭐</span>`).join('')}
      </div>
      <div class="rating-labels"><span>น้อยมาก</span><span>ปานกลาง</span><span>มากที่สุด</span></div>
      <div class="rating-value" id="ratingValue">เลือกระดับ 1-5</div>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>ส่งคะแนน</button>`;
    contentEl.innerHTML = html;
    let selectedRating = 0;
    const stars = contentEl.querySelectorAll(".rating-star");
    const valueEl = document.getElementById("ratingValue");
    const btn = document.getElementById("submitBtn");
    const emojiLabels = ['', ' ต้องปรับปรุง', '😐 พอใช้', '🙂 ดี', '😄 ดีมาก', '🤩 ยอดเยี่ยม!'];
    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = parseInt(star.dataset.value);
        stars.forEach((s, i) => s.classList.toggle("active", i < selectedRating));
        valueEl.textContent = `${selectedRating}/5 — ${emojiLabels[selectedRating]}`;
        btn.disabled = false;
        if (navigator.vibrate) navigator.vibrate(10);
      });
    });
    btn.addEventListener("click", () => submitRating(selectedRating, data));
  }
  else if (data.type === "quiz" || data.type === "choice") {
    data.options.forEach((opt, i) => {
      html += `<button class="opt-btn" data-idx="${i}">
        <span class="letter" style="background:${COLORS[i%COLORS.length]}">${String.fromCharCode(65+i)}</span>
        <span>${escapeHtml(opt)}</span>
      </button>`;
    });
    contentEl.innerHTML = html;
    contentEl.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", () => voteChoice(parseInt(btn.dataset.idx), data));
    });
  }
}

function renderVoted(data, votedInfo) {
  let html = imageHtml(data);
  html += `<div class="question-wrap"><div class="question">${escapeHtml(data.question)}</div>${underlineSvg()}</div>`;
  
  if (data.type === "text") {
    html += `<div class="your-answer">💬 "${escapeHtml(votedInfo.text || "")}"</div>`;
  } 
  else if (data.type === "rating") {
    const emojiLabels = ['', '😕', '😐', '🙂', '😄', '🤩'];
    html += `<div class="your-answer">${emojiLabels[votedInfo.value] || '⭐'} คุณให้คะแนน: <strong>${votedInfo.value}/5</strong></div>`;
  }
  else if (data.type === "quiz") {
    data.options.forEach((opt, i) => {
      const isChosen = i === votedInfo.optionIndex;
      const isCorrect = i === data.correctIndex;
      let cls = "", icon = "";
      if (isCorrect) { cls = "correct"; icon = "✓"; }
      else if (isChosen) { cls = "wrong"; icon = "✕"; }
      html += `<div class="opt-btn ${cls}" style="cursor:default;">
        <span class="letter" style="background:${COLORS[i%COLORS.length]}">${String.fromCharCode(65+i)}</span>
        <span>${escapeHtml(opt)}</span>
        ${icon ? `<span class="result-icon">${icon}</span>` : ''}
      </div>`;
    });
    const wasCorrect = votedInfo.optionIndex === data.correctIndex;
    html += `<div style="text-align:center;"><div class="quiz-result ${wasCorrect ? 'correct' : 'wrong'}">
      ${wasCorrect ? '🎉 ถูกต้อง!' : ' ยังไม่ถูก — ข้อที่ถูกคือ ' + String.fromCharCode(65 + data.correctIndex)}
    </div></div>`;
    if (wasCorrect) setTimeout(() => confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 } }), 300);
  }
  else {
    data.options.forEach((opt, i) => {
      const isChosen = i === votedInfo.optionIndex;
      html += `<div class="opt-btn ${isChosen ? 'selected' : ''}" style="cursor:default;">
        <span class="letter" style="background:${COLORS[i%COLORS.length]}">${String.fromCharCode(65+i)}</span>
        <span>${escapeHtml(opt)}</span>
        ${isChosen ? '<span class="result-icon">✓</span>' : ''}
      </div>`;
    });
  }
  
  html += `<div class="msg" style="margin-top:18px;">คุณตอบแล้ว ขอบคุณครับ <b>${escapeHtml(studentName)}</b> 🙏</div>`;
  contentEl.innerHTML = html;
  gsap.from(".opt-btn, .your-answer, .quiz-result", { opacity: 0, y: 10, stagger: 0.05, duration: 0.4, ease: "power2.out" });
}

function escapeHtml(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}

async function voteChoice(optionIndex, data) {
  const responseRef = doc(db, "polls", classId, "responses", studentId);
  try {
    await runTransaction(db, async (tx) => {
      const pollSnap = await tx.get(pollRef);
      if (!pollSnap.exists()) throw new Error("ไม่พบโพล");
      const pollData = pollSnap.data();
      if (!pollData.active) throw new Error("โพลปิดไปแล้ว");
      const respSnap = await tx.get(responseRef);
      if (respSnap.exists() && respSnap.data().pollId === pollData.pollId) throw new Error("คุณตอบไปแล้ว");
      const counts = [...pollData.counts];
      counts[optionIndex] = (counts[optionIndex] || 0) + 1;
      tx.update(pollRef, { counts });
      tx.set(responseRef, { pollId: pollData.pollId, optionIndex, studentName, votedAt: serverTimestamp() });
    });
    const votedInfo = { pollId: data.pollId, optionIndex };
    localStorage.setItem(`voted_${classId}`, JSON.stringify(votedInfo));
    renderVoted(data, votedInfo);
    showToast("ส่งคำตอบแล้ว!", "success");
  } catch (err) { showToast(err.message, "error"); }
}

async function submitText(text, data) {
  if (!text) return;
  const responseRef = doc(db, "polls", classId, "responses", studentId);
  try {
    await runTransaction(db, async (tx) => {
      const pollSnap = await tx.get(pollRef);
      if (!pollSnap.exists()) throw new Error("ไม่พบโพล");
      const pollData = pollSnap.data();
      if (!pollData.active) throw new Error("โพลปิดไปแล้ว");
      const respSnap = await tx.get(responseRef);
      if (respSnap.exists() && respSnap.data().pollId === pollData.pollId) throw new Error("คุณตอบไปแล้ว");
      tx.set(responseRef, { pollId: pollData.pollId, text, studentName, votedAt: serverTimestamp() });
    });
    const votedInfo = { pollId: data.pollId, text };
    localStorage.setItem(`voted_${classId}`, JSON.stringify(votedInfo));
    renderVoted(data, votedInfo);
    showToast("ส่งคำตอบแล้ว!", "success");
  } catch (err) { showToast(err.message, "error"); }
}

async function submitRating(value, data) {
  if (value < 1 || value > 5) return;
  const responseRef = doc(db, "polls", classId, "responses", studentId);
  try {
    await runTransaction(db, async (tx) => {
      const pollSnap = await tx.get(pollRef);
      if (!pollSnap.exists()) throw new Error("ไม่พบโพล");
      const pollData = pollSnap.data();
      if (!pollData.active) throw new Error("โพลปิดไปแล้ว");
      const respSnap = await tx.get(responseRef);
      if (respSnap.exists() && respSnap.data().pollId === pollData.pollId) throw new Error("คุณตอบไปแล้ว");
      const counts = [...(pollData.counts || Array(5).fill(0))];
      counts[value - 1] = (counts[value - 1] || 0) + 1;
      tx.update(pollRef, { counts });
      tx.set(responseRef, { pollId: pollData.pollId, value, studentName, votedAt: serverTimestamp() });
    });
    const votedInfo = { pollId: data.pollId, value };
    localStorage.setItem(`voted_${classId}`, JSON.stringify(votedInfo));
    renderVoted(data, votedInfo);
    showToast(`ให้คะแนน ${value}/5 แล้ว!`, "success");
    confetti({ particleCount: 40, spread: 40, origin: { y: 0.7 } });
  } catch (err) { showToast(err.message, "error"); }
}
