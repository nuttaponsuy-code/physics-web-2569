<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โพลสด — ห้องควบคุมครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16241C;
    --bg-panel:#1F3327;
    --bg-panel-2:#233A2C;
    --ink:#F3F1E7;
    --ink-dim:#B9C4B7;
    --rule:rgba(243,241,231,.14);
    --yellow:#F2C744;
    --sky:#74B9E7;
    --mint:#7ED9A8;
    --coral:#F2789F;
    --orange:#F2914F;
    --lilac:#C9A6E8;
    --danger:#E4675C;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Sarabun',sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(242,199,68,.06), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(116,185,231,.06), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 5px),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:28px 20px 60px;
  }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  .wrap{max-width:960px;margin:0 auto;}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:19px;transform:rotate(-4deg);flex:none;}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:.2px;}
  .brand span{display:block;font-size:12.5px;color:var(--ink-dim);font-weight:400;margin-top:1px;}
  .class-picker{display:flex;align-items:center;gap:10px;}
  .class-picker label{font-size:13px;color:var(--ink-dim);}
  select{
    background:var(--bg-panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:10px;padding:9px 14px;font-family:'Sarabun',sans-serif;font-size:15px;font-weight:600;
    cursor:pointer;
  }

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--rule);}
  .tab-btn{
    background:none;border:none;color:var(--ink-dim);font-family:'Sarabun',sans-serif;font-weight:600;
    font-size:15px;padding:11px 6px;cursor:pointer;position:relative;top:1px;
  }
  .tab-btn.active{color:var(--ink);border-bottom:2.5px solid var(--yellow);}

  .panel{
    background:var(--bg-panel);border:1px solid var(--rule);border-radius:var(--radius);
    padding:24px;margin-bottom:18px;
  }

  /* ---------- form ---------- */
  .type-switch{display:flex;gap:8px;margin-bottom:18px;}
  .type-opt{
    flex:1;text-align:center;padding:12px 10px;border-radius:10px;border:1.5px solid var(--rule);
    background:var(--bg-panel-2);cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink-dim);
    transition:.15s;
  }
  .type-opt strong{display:block;font-family:'Kanit',sans-serif;font-size:15.5px;color:var(--ink);font-weight:700;margin-bottom:2px;}
  .type-opt.active{border-color:var(--yellow);background:rgba(242,199,68,.09);color:var(--ink);}

  label.field-label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-dim);margin-bottom:7px;margin-top:16px;}
  label.field-label:first-of-type{margin-top:0;}
  input[type=text], textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--rule);
    background:var(--bg-panel-2);color:var(--ink);font-size:15.5px;font-family:'Sarabun',sans-serif;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--yellow);outline-offset:1px;}
  input[type=text]::placeholder, textarea::placeholder{color:#7C8A80;}

  .option-row{display:flex;gap:8px;margin-bottom:9px;align-items:center;}
  .option-row .swatch{width:11px;height:11px;border-radius:3px;flex:none;}
  .option-row input{flex:1;}
  .btn-remove{
    background:none;border:1.5px solid var(--rule);color:var(--ink-dim);border-radius:8px;
    width:36px;height:36px;cursor:pointer;font-size:15px;flex:none;
  }
  .btn-remove:hover{border-color:var(--danger);color:var(--danger);}
  .add-option{
    background:none;border:1.5px dashed var(--rule);color:var(--ink-dim);border-radius:10px;
    padding:10px;width:100%;cursor:pointer;font-weight:600;font-size:14px;margin-top:2px;
  }
  .add-option:hover{border-color:var(--sky);color:var(--ink);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:none;border-radius:11px;
    font-size:15px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;
  }
  .btn-primary{background:var(--yellow);color:#1B2B1F;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:var(--bg-panel-2);color:var(--ink);border:1.5px solid var(--rule);}
  .btn-secondary:hover{border-color:var(--ink-dim);}
  .btn-ghost{background:none;color:var(--ink-dim);border:1.5px solid var(--rule);}
  .btn-danger{background:var(--danger);color:#2A1210;}
  .form-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

  /* ---------- bank list ---------- */
  .bank-empty{color:var(--ink-dim);font-size:14.5px;text-align:center;padding:34px 10px;}
  .bank-card{
    border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:12px;
    display:flex;justify-content:space-between;gap:16px;align-items:flex-start;background:var(--bg-panel-2);
  }
  .bank-card-main{min-width:0;}
  .badge{
    display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
    margin-bottom:8px;font-family:'Sarabun',sans-serif;
  }
  .badge-choice{background:rgba(116,185,231,.16);color:var(--sky);}
  .badge-text{background:rgba(201,166,232,.18);color:var(--lilac);}
  .bank-q{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.4;}
  .bank-opts{font-size:13px;color:var(--ink-dim);line-height:1.6;}
  .bank-actions{display:flex;flex-direction:column;gap:8px;flex:none;}
  .bank-actions button{white-space:nowrap;}

  /* ---------- presentation / live view ---------- */
  #liveView{display:none;}
  .live-shell{
    background:var(--bg-panel);border:1px solid var(--rule);border-radius:var(--radius);
    padding:26px 26px 30px;
  }
  .live-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .class-badge{
    display:inline-block;background:rgba(242,199,68,.14);color:var(--yellow);font-weight:700;
    font-size:13px;padding:6px 14px;border-radius:999px;
  }
  .live-tools{display:flex;gap:8px;flex-wrap:wrap;}
  .icon-btn{
    background:var(--bg-panel-2);border:1.5px solid var(--rule);color:var(--ink);border-radius:9px;
    padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  }
  .icon-btn:hover{border-color:var(--ink-dim);}

  .qr-row{display:flex;align-items:center;gap:16px;justify-content:center;margin:18px 0 8px;}
  .qr-row img{border-radius:10px;border:6px solid var(--bg-panel-2);}
  .link-box{font-size:13px;color:var(--ink-dim);word-break:break-all;max-width:260px;}

  .stage{padding:18px 4px 6px;text-align:center;}
  .question-wrap{position:relative;display:inline-block;max-width:100%;margin-bottom:34px;}
  .question-display{
    font-family:'Kanit',sans-serif;font-weight:700;line-height:1.32;color:var(--ink);
    font-size:clamp(22px,3.4vw,34px);
  }
  .chalk-underline{display:block;width:74%;height:12px;margin:10px auto 0;}
  .chalk-underline path{stroke:var(--yellow);stroke-width:3.4;fill:none;stroke-linecap:round;opacity:.9;}

  .bars{max-width:640px;margin:0 auto;text-align:left;}
  .bar-row{margin-bottom:16px;}
  .bar-label{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:6px;}
  .bar-label .opt-name{padding-left:2px;}
  .bar-track{background:var(--bg-panel-2);border-radius:9px;height:34px;overflow:hidden;}
  .bar-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
    color:#16241C;font-weight:700;font-size:13.5px;transition:width .5s cubic-bezier(.2,.9,.3,1);white-space:nowrap;min-width:2%;}

  .cloud{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:center;
    max-width:760px;margin:0 auto;min-height:120px;padding:10px 0;}
  .tag{
    font-family:'Kanit',sans-serif;font-weight:700;padding:6px 4px;border-radius:8px;
    animation:pop .35s ease;line-height:1.2;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .cloud-empty{color:var(--ink-dim);font-size:14.5px;padding:30px 0;}

  .total-line{text-align:center;color:var(--ink-dim);font-size:13.5px;margin-top:20px;}
  .live-actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap;}
  .status-msg{text-align:center;padding:10px;border-radius:9px;margin-top:14px;font-weight:600;font-size:14px;}
  .status-ok{background:rgba(126,217,168,.14);color:var(--mint);}
  .status-err{background:rgba(228,103,92,.14);color:var(--danger);}

  /* ---------- fullscreen presentation mode ---------- */
  body.present-mode{padding:0;}
  body.present-mode .wrap{max-width:none;}
  body.present-mode .top,
  body.present-mode .tabs,
  body.present-mode #setupView{display:none !important;}
  body.present-mode .live-shell{
    border:none;border-radius:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw;
  }
  body.present-mode .question-display{font-size:clamp(30px,5.4vw,58px);}
  body.present-mode .qr-row img{width:150px;height:150px;}
  body.present-mode .bars,body.present-mode .cloud{max-width:900px;}
  body.present-mode .bar-track{height:46px;}
  body.present-mode .bar-label{font-size:19px;}
  body.present-mode .tag{font-size:inherit;}

  @media(max-width:640px){
    .bank-card{flex-direction:column;}
    .bank-actions{flex-direction:row;width:100%;}
    .bank-actions button{flex:1;}
    .qr-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="brand-mark">🖍️</div>
      <div>
        <h1>โพลสด</h1>
        <span>ห้องควบคุมสำหรับครู</span>
      </div>
    </div>
    <div class="class-picker">
      <label for="classSelect">ห้องเรียน</label>
      <select id="classSelect"></select>
    </div>
  </div>

  <div id="setupView">
    <div class="tabs">
      <button class="tab-btn active" data-tab="create">สร้างคำถามใหม่</button>
      <button class="tab-btn" data-tab="bank">คลังคำถาม <span id="bankCount"></span></button>
    </div>

    <div class="panel" id="createTab">
      <div class="type-switch">
        <div class="type-opt active" data-type="choice">
          <strong>เลือกตอบ</strong>
          ให้นักเรียนแตะตัวเลือก
        </div>
        <div class="type-opt" data-type="text">
          <strong>พิมพ์ตอบ</strong>
          ให้นักเรียนพิมพ์คำตอบสั้นๆ
        </div>
      </div>

      <label class="field-label" for="questionInput">คำถาม</label>
      <textarea id="questionInput" rows="2" placeholder="เช่น แรงลัพธ์ที่กระทำต่อวัตถุนี้มีทิศทางใด?"></textarea>

      <div id="choiceFields">
        <label class="field-label">ตัวเลือกคำตอบ</label>
        <div id="optionsContainer"></div>
        <button class="add-option" id="addOptionBtn" type="button">+ เพิ่มตัวเลือก</button>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" id="saveToBankBtn">📥 บันทึกลงคลัง</button>
        <button class="btn btn-primary" id="startNowBtn">🚀 เริ่มโพลทันที</button>
      </div>
    </div>

    <div class="panel" id="bankTab" style="display:none;">
      <div id="bankList"></div>
    </div>
  </div>

  <div id="liveView">
    <div class="live-shell">
      <div class="live-top">
        <span class="class-badge" id="classBadge"></span>
        <div class="live-tools">
          <button class="icon-btn" id="toggleQrBtn">🔳 QR</button>
          <button class="icon-btn" id="fullscreenBtn">⛶ เต็มจอ</button>
        </div>
      </div>

      <div class="qr-row" id="qrRow">
        <img id="qrImg" src="" alt="QR Code" width="150" height="150">
        <div class="link-box" id="linkText"></div>
      </div>

      <div class="stage">
        <div class="question-wrap">
          <div class="question-display" id="liveQuestion"></div>
          <svg class="chalk-underline" viewBox="0 0 300 14" preserveAspectRatio="none">
            <path d="M2,9 Q40,2 78,9 T154,9 T230,9 T298,9"/>
          </svg>
        </div>

        <div class="bars" id="barsView" style="display:none;"></div>
        <div class="cloud" id="cloudView" style="display:none;"></div>

        <div class="total-line" id="totalVotes"></div>
      </div>

      <div class="live-actions">
        <button class="btn btn-danger" id="closePollBtn">⏹️ ปิดโพล &amp; บันทึกลง Sheet</button>
        <button class="btn btn-secondary" id="newPollBtn">🔄 กลับไปตั้งคำถาม</button>
      </div>
      <div id="statusMsg"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, updateDoc, onSnapshot, serverTimestamp,
  collection, addDoc, deleteDoc, getDocs, query, where, runTransaction, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, APPS_SCRIPT_URL, CLASS_LIST } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CHALK = ['#F2C744','#74B9E7','#7ED9A8','#F2789F','#F2914F','#C9A6E8'];
const chalkColor = i => CHALK[i % CHALK.length];

/* ================= class selector ================= */
const classSelect = document.getElementById("classSelect");
CLASS_LIST.forEach(c => {
  const opt = document.createElement("option");
  opt.value = c;
  opt.textContent = "ม." + c.replace("-", "/");
  classSelect.appendChild(opt);
});
let CLASS_ID = classSelect.value;
classSelect.addEventListener("change", () => { CLASS_ID = classSelect.value; watchClass(); loadBank(); });

function pollRef() { return doc(db, "polls", CLASS_ID); }
function bankCol() { return collection(db, "polls", CLASS_ID, "bank"); }
function responsesCol() { return collection(db, "polls", CLASS_ID, "responses"); }

/* ================= tabs ================= */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("createTab").style.display = tab === "create" ? "block" : "none";
    document.getElementById("bankTab").style.display = tab === "bank" ? "block" : "none";
    if (tab === "bank") loadBank();
  });
});

/* ================= create-question form ================= */
let currentType = "choice";
document.querySelectorAll(".type-opt").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".type-opt").forEach(o => o.classList.remove("active"));
    el.classList.add("active");
    currentType = el.dataset.type;
    document.getElementById("choiceFields").style.display = currentType === "choice" ? "block" : "none";
  });
});

const optionsContainer = document.getElementById("optionsContainer");
function addOptionRow(value = "") {
  const idx = optionsContainer.children.length;
  const row = document.createElement("div");
  row.className = "option-row";
  row.innerHTML = `<span class="swatch" style="background:${chalkColor(idx)}"></span>
    <input type="text" class="opt-input" value="${value}" placeholder="ตัวเลือก">
    <button class="btn-remove" type="button">✕</button>`;
  row.querySelector(".btn-remove").addEventListener("click", () => {
    if (optionsContainer.children.length > 2) { row.remove(); restripeSwatches(); }
    else alert("ต้องมีอย่างน้อย 2 ตัวเลือก");
  });
  optionsContainer.appendChild(row);
}
function restripeSwatches() {
  [...optionsContainer.children].forEach((row, i) => {
    row.querySelector(".swatch").style.background = chalkColor(i);
  });
}
addOptionRow(); addOptionRow();
document.getElementById("addOptionBtn").addEventListener("click", () => addOptionRow());

function readForm() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("กรุณากรอกคำถาม"); return null; }
  if (currentType === "choice") {
    const options = [...document.querySelectorAll(".opt-input")].map(i => i.value.trim()).filter(v => v);
    if (options.length < 2) { alert("ต้องมีอย่างน้อย 2 ตัวเลือก"); return null; }
    return { type: "choice", question, options };
  }
  return { type: "text", question };
}
function clearForm() {
  document.getElementById("questionInput").value = "";
  optionsContainer.innerHTML = "";
  addOptionRow(); addOptionRow();
}

document.getElementById("saveToBankBtn").addEventListener("click", async () => {
  const data = readForm();
  if (!data) return;
  await addDoc(bankCol(), { ...data, createdAt: serverTimestamp() });
  clearForm();
  document.querySelector('.tab-btn[data-tab="bank"]').click();
});

document.getElementById("startNowBtn").addEventListener("click", async () => {
  const data = readForm();
  if (!data) return;
  await addDoc(bankCol(), { ...data, createdAt: serverTimestamp() });
  await launchPoll(data);
  clearForm();
});

/* ================= question bank ================= */
async function loadBank() {
  const list = document.getElementById("bankList");
  const countEl = document.getElementById("bankCount");
  list.innerHTML = `<div class="bank-empty">กำลังโหลด...</div>`;
  const snap = await getDocs(query(bankCol(), orderBy("createdAt", "desc")));
  countEl.textContent = snap.empty ? "" : `(${snap.size})`;
  if (snap.empty) {
    list.innerHTML = `<div class="bank-empty">ยังไม่มีคำถามในคลัง — สร้างคำถามแล้วกด “บันทึกลงคลัง” เพื่อเก็บไว้เปิดทีหลัง</div>`;
    return;
  }
  list.innerHTML = "";
  snap.forEach(d => {
    const q = d.data();
    const card = document.createElement("div");
    card.className = "bank-card";
    const optsHtml = q.type === "choice"
      ? `<div class="bank-opts">${q.options.map((o,i)=>`● ${o}`).join(" &nbsp; ")}</div>`
      : `<div class="bank-opts">พิมพ์ตอบอิสระ</div>`;
    card.innerHTML = `
      <div class="bank-card-main">
        <span class="badge ${q.type==='choice'?'badge-choice':'badge-text'}">${q.type==='choice'?'เลือกตอบ':'พิมพ์ตอบ'}</span>
        <div class="bank-q">${escapeHtml(q.question)}</div>
        ${optsHtml}
      </div>
      <div class="bank-actions">
        <button class="btn btn-primary" data-act="start">🚀 เริ่มโพลนี้</button>
        <button class="btn btn-ghost" data-act="del">🗑 ลบ</button>
      </div>`;
    card.querySelector('[data-act="start"]').addEventListener("click", () => launchPoll(q));
    card.querySelector('[data-act="del"]').addEventListener("click", async () => {
      if (confirm("ลบคำถามนี้ออกจากคลังใช่หรือไม่?")) { await deleteDoc(d.ref); loadBank(); }
    });
    list.appendChild(card);
  });
}
function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

/* ================= launch / live poll ================= */
async function launchPoll(data) {
  const pollId = Date.now().toString();
  const payload = { active: true, pollId, question: data.question, type: data.type, createdAt: serverTimestamp() };
  if (data.type === "choice") {
    payload.options = data.options;
    payload.counts = data.options.map(() => 0);
  }
  await setDoc(pollRef(), payload);

  document.getElementById("classBadge").textContent = "ห้อง ม." + CLASS_ID.replace("-", "/");
  const studentUrl = `${location.origin}${location.pathname.replace('poll-teacher.html','poll-student.html')}?class=${encodeURIComponent(CLASS_ID)}`;
  document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(studentUrl)}`;
  document.getElementById("linkText").textContent = studentUrl;
  document.getElementById("statusMsg").textContent = "";
  document.getElementById("statusMsg").className = "";

  showLive();
}

function showLive() {
  document.getElementById("setupView").style.display = "none";
  document.getElementById("liveView").style.display = "block";
}
function showSetup() {
  document.body.classList.remove("present-mode");
  document.getElementById("liveView").style.display = "none";
  document.getElementById("setupView").style.display = "block";
}

/* ================= live listeners ================= */
let unsubPoll = null, unsubResponses = null;
let latestPollData = null;

function watchClass() {
  if (unsubPoll) unsubPoll();
  if (unsubResponses) unsubResponses();
  unsubPoll = onSnapshot(pollRef(), (snap) => {
    if (!snap.exists() || !snap.data().active) return;
    const data = snap.data();
    latestPollData = data;
    document.getElementById("classBadge").textContent = "ห้อง ม." + CLASS_ID.replace("-", "/");
    const studentUrl = `${location.origin}${location.pathname.replace('poll-teacher.html','poll-student.html')}?class=${encodeURIComponent(CLASS_ID)}`;
    document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(studentUrl)}`;
    document.getElementById("linkText").textContent = studentUrl;
    showLive();
    renderQuestion(data);
    watchResponses(data.pollId, data.type);
  });
}
watchClass();
loadBank();

function watchResponses(pollId, type) {
  if (unsubResponses) unsubResponses();
  unsubResponses = onSnapshot(query(responsesCol(), where("pollId", "==", pollId)), (snap) => {
    if (type === "text") {
      const answers = [];
      snap.forEach(d => answers.push(d.data().text));
      renderCloud(answers);
    }
  });
}

function renderQuestion(data) {
  document.getElementById("liveQuestion").textContent = data.question;
  document.getElementById("barsView").style.display = data.type === "choice" ? "block" : "none";
  document.getElementById("cloudView").style.display = data.type === "text" ? "flex" : "none";
  if (data.type === "choice") renderBars(data);
}

function renderBars(data) {
  const total = (data.counts || []).reduce((a, b) => a + b, 0) || 0;
  const el = document.getElementById("barsView");
  el.innerHTML = "";
  data.options.forEach((opt, i) => {
    const count = data.counts[i] || 0;
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `<div class="bar-label"><span class="opt-name">${escapeHtml(opt)}</span><span>${count} คน (${pct}%)</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${chalkColor(i)}"></div></div>`;
    el.appendChild(row);
  });
  document.getElementById("totalVotes").textContent = `รวมทั้งหมด ${total} คน`;
}

function renderCloud(answers) {
  const el = document.getElementById("cloudView");
  if (!answers.length) {
    el.innerHTML = `<div class="cloud-empty">กำลังรอคำตอบจากนักเรียน...</div>`;
    document.getElementById("totalVotes").textContent = "";
    return;
  }
  const freq = {};
  answers.forEach(a => {
    const key = a.trim();
    if (!key) return;
    freq[key] = (freq[key] || 0) + 1;
  });
  const entries = Object.entries(freq).sort((a, b) => b[1] - a[1]);
  const maxCount = entries[0][1];
  el.innerHTML = "";
  entries.forEach(([text, count], i) => {
    const scale = 0.7 + (count / maxCount) * 1.3; // 0.7em .. 2em
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.style.fontSize = scale + "em";
    tag.style.color = chalkColor(i);
    tag.textContent = count > 1 ? `${text} ×${count}` : text;
    el.appendChild(tag);
  });
  document.getElementById("totalVotes").textContent = `รวมทั้งหมด ${answers.length} คำตอบ`;
}

/* ================= live view actions ================= */
document.getElementById("toggleQrBtn").addEventListener("click", () => {
  const row = document.getElementById("qrRow");
  row.style.display = row.style.display === "none" ? "flex" : "none";
});
document.getElementById("fullscreenBtn").addEventListener("click", () => {
  document.body.classList.add("present-mode");
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) document.body.classList.remove("present-mode");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.body.classList.contains("present-mode") && !document.fullscreenElement) {
    document.body.classList.remove("present-mode");
  }
});

document.getElementById("newPollBtn").addEventListener("click", async () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.body.classList.remove("present-mode");
  if (latestPollData && latestPollData.active) {
    await updateDoc(pollRef(), { active: false });
  }
  showSetup();
});

document.getElementById("closePollBtn").addEventListener("click", async () => {
  if (!latestPollData) return;
  if (!confirm("ปิดโพลและบันทึกผลลง Google Sheet ใช่หรือไม่?")) return;
  await updateDoc(pollRef(), { active: false });

  const statusEl = document.getElementById("statusMsg");
  statusEl.textContent = "กำลังบันทึก...";
  statusEl.className = "status-msg";

  let results;
  if (latestPollData.type === "choice") {
    results = latestPollData.options.map((opt, i) => ({ option: opt, count: latestPollData.counts[i] || 0 }));
  } else {
    const snap = await getDocs(query(responsesCol(), where("pollId", "==", latestPollData.pollId)));
    const freq = {};
    snap.forEach(d => { const t = (d.data().text || "").trim(); if (t) freq[t] = (freq[t] || 0) + 1; });
    results = Object.entries(freq).map(([answer, count]) => ({ answer, count }));
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "savePollResult",
        payload: {
          classId: "ม." + CLASS_ID.replace("-", "/"),
          question: latestPollData.question,
          type: latestPollData.type,
          results
        }
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusEl.textContent = "✅ บันทึกลง Sheet สำเร็จแล้ว";
    statusEl.className = "status-msg status-ok";
  } catch (err) {
    statusEl.textContent = "❌ บันทึกไม่สำเร็จ: " + err.message;
    statusEl.className = "status-msg status-err";
  }
});
</script>
